# DP-YOLO Architecture – YOLOv5 format
# Cải tiến so với YOLOv5s:
#   Backbone:  stage 1-3 dùng D2C3 (DCNv2), stage 4 dùng D3C3 (DCNv3 "3+1")
#   Neck:      C3Ghost thay C3, PTCSP (CNN+Transformer) ở vị trí cuối
#   Head:      P2 + P3 + P4 + P5 (giữ cả dấu hiệu nhỏ và lá lớn)
#   Loss:      W3F_MPDIoU  (được cấu hình trong training script)
#   Label:     PSA assignment  (được cấu hình trong training script)

strides: [4, 8, 16, 32]

# anchors (điều chỉnh sau khi chạy autoanchor trên dataset thực)
# [P2, P3, P4, P5] – dataset có cả lá rất lớn và chi tiết nhỏ
anchors:
  - [4,5,  6,8,  9,11]            # P2/4
  - [16,21,  26,35,  47,58]       # P3/8
  - [60,70,  90,110,  140,170]    # P4/16
  - [180,210,  300,330,  500,520] # P5/32

# input channels
nc:    28    # số class pest (khop voi pest.yaml)
depth_multiple:  0.33
width_multiple:  0.50

# ─────────────────────────────────────────────────────────────────────
# Backbone
# ─────────────────────────────────────────────────────────────────────
backbone:
  # [from, number, module, args]
  [
    # --- stem ---
    [ -1, 1, Conv,    [64, 6, 2, 2]],               #  0 - P1/2
    # --- stage 1 (D2C3) ---
    [ -1, 1, Conv,    [128, 3, 2]],                  #  1 - P2/4
    [ -1, 3, D2C3,    [128, True]],                  #  2
    # --- stage 2 (D2C3) ---
    [ -1, 1, Conv,    [256, 3, 2]],                  #  3 - P3/8
    [ -1, 6, D2C3,    [256, True]],                  #  4
    # --- stage 3 (D2C3) ---
    [ -1, 1, Conv,    [512, 3, 2]],                  #  5 - P4/16
    [ -1, 9, D2C3,    [512, True]],                  #  6
    # --- stage 4 (D3C3 – chiến lược "3+1") ---
    [ -1, 1, Conv,    [1024, 3, 2]],                 #  7 - P5/32
    [ -1, 3, D3C3,    [1024, True]],                 #  8
    [ -1, 1, SPPF,    [1024, 5]],                    #  9
  ]

# ─────────────────────────────────────────────────────────────────────
# Neck  (PAN + PTCSP + C3Ghost)
# ─────────────────────────────────────────────────────────────────────
head:
  [
    # --- top-down path ---
    [ -1,  1, Conv,      [512, 1, 1]],               # 10 (from P5)
    [ -1,  1, nn.Upsample, [None, 2, 'nearest']],    # 11
    [ [6, -1], 1, Concat, [1]],                       # 12 cat P4
    [ -1,  3, C3Ghost,   [512, False]],               # 13

    [ -1,  1, Conv,      [256, 1, 1]],               # 14
    [ -1,  1, nn.Upsample, [None, 2, 'nearest']],    # 15
    [ [4, -1], 1, Concat, [1]],                       # 16 cat P3
    [ -1,  3, C3Ghost,   [256, False]],               # 17  <-- P3 feat

    [ -1,  1, Conv,      [128, 1, 1]],               # 18
    [ -1,  1, nn.Upsample, [None, 2, 'nearest']],    # 19
    [ [2, -1], 1, Concat, [1]],                       # 20 cat P2
    [ -1,  3, PTCSP,     [128, False]],               # 21  <-- P2 feat (Transformer)

    # --- bottom-up path ---
    [ -1,  1, Conv,      [128, 3, 2]],               # 22
    [ [17, -1], 1, Concat, [1]],                      # 23 cat P3 feat
    [ -1,  3, C3Ghost,   [256, False]],               # 24  <-- P3 out

    [ -1,  1, Conv,      [256, 3, 2]],               # 25
    [ [13, -1], 1, Concat, [1]],                      # 26 cat P4 feat
    [ -1,  3, C3Ghost,   [512, False]],               # 27  <-- P4 out

    # Recover P5 instead of discarding it. Large leaf boxes are common in
    # this dataset, while P2 remains available for small disease details.
    [ -1,  1, Conv,      [512, 3, 2]],                 # 28
    [ [9, -1], 1, Concat, [1]],                        # 29 cat backbone P5
    [ -1,  3, C3Ghost,   [1024, False]],               # 30 <-- P5 out

    # Detect(P2, P3, P4, P5) – four complementary scales
    [ [21, 24, 27, 30], 1, Detect, [nc, anchors]],     # 31
  ]
