# RL Fine-tuning Hyperparameters – Level 2/3 (GRPO-style + DAPO)
# Base config từ hyp.rl.yaml, thêm GRPO/DAPO params

# ── Chọn level (override bằng CLI --level) ────────────────────────────
# level: 2   # set bằng --level khi chạy train_rl.py

# ── Optimizer ──────────────────────────────────────────────────────────
lr: 1.0e-6            # Implicit KL constraint. lr > 1e-5: catastrophic forgetting
optimizer: adam
grad_clip: 1.0

# ── Training schedule ──────────────────────────────────────────────────
steps: 50000
log_interval: 100
save_interval: 5000
eval_interval: 5000

# ── Reward (rule-based – không cần human label) ────────────────────────
reward_type: composite   # recall | small | composite
reward_alpha: 0.6        # α: recall weight (0.6), small-object weight (0.4)
iou_threshold: 0.5       # IoU để tính match GT-pred
duplicate_penalty: 0.3   # phạt prediction thừa (nhẹ: ưu tiên recall)
small_thresh: 32         # area < 32² px = small object

# ── EMA Baseline (Level 1 only) ────────────────────────────────────────
ema_alpha: 0.99

# ── GRPO group augmentation (Level 2, 3) ──────────────────────────────
# G: 4  # set bằng --G khi chạy train_rl.py

# ── DAPO improvements (Level 3 only) ──────────────────────────────────
eps_low:  0.1    # Clip lower bound (PPO standard)
eps_high: 0.3    # Clip upper bound (DAPO: cao hơn eps_low = "clip-higher")
min_std:  0.01   # Dynamic filter: bỏ sample nếu group reward std < 0.01

# ── Inference trong training loop ──────────────────────────────────────
conf_thres: 0.20   # Thấp hơn eval (0.25) → nhiều predictions → signal mạnh
iou_thres:  0.45
batch_size: 16

# ── Data ───────────────────────────────────────────────────────────────
data_root: ../data/V2

# ── Architecture ───────────────────────────────────────────────────────
freeze_backbone: false
