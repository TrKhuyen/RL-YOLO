# RL Fine-tuning Hyperparameters
# Tham khảo: yanivnik (lr=1e-6), bwconrad (lr=5e-5 fine-tune)

# Optimizer
lr: 1.0e-6             # Learning rate – rất nhỏ để tránh catastrophic forgetting
optimizer: adam         # adam | sgd
grad_clip: 1.0          # gradient clipping max norm

# Training schedule
steps: 50000            # tổng số bước RL
log_interval: 100       # log tensorboard mỗi N bước
save_interval: 5000     # lưu checkpoint mỗi N bước
eval_interval: 5000     # evaluate trên val set mỗi N bước

# Reward
reward_type: composite  # recall | small | composite
reward_alpha: 0.6       # trọng số recall vs small-object reward (composite only)
iou_threshold: 0.5      # IoU threshold để tính match GT-pred
duplicate_penalty: 0.3  # hệ số phạt prediction thừa
small_thresh: 32        # ngưỡng diện tích (px) cho "vật thể nhỏ"

# EMA Baseline
ema_alpha: 0.99         # EMA decay để giảm variance REINFORCE

# Inference settings (khi lấy predictions trong vòng lặp RL)
conf_thres: 0.20        # ngưỡng confidence (thấp hơn train để có đủ preds)
iou_thres: 0.45         # NMS IoU threshold

# Architecture
freeze_backbone: false   # đóng băng backbone khi fine-tune
batch_size: 16           # batch size cho RL loop
