# Four trials by default; --trials sets a cumulative budget explicitly.
protocol: kb3_tpe_v2_kb1_pretrained
method: tpe
rl_enabled: false
recipe_source: kb1_supervised
initialization: pretrained
trials: 4
seed: null
sampler_seed: 42
# Default Optuna startup=10 would make a four-trial experiment entirely random.
# Trial 0 is enqueued KB1; trial 1 is local random; trials 2/3 use TPE.
n_startup_trials: 2
n_ei_candidates: 24
# Limit the first small experiment to two dimensions around the actual KB1 recipe.
local_factors:
  lr0: [0.5, 1.5]
  weight_decay: [0.5, 2.0]
# Momentum and augmentation stay at the KB1 starting values.
# These must inherit the actual selected model's supervised KB1 args.yaml.
# yolov8n currently resolves to epochs=200, patience=30, seed=0, batch=16.
epochs: null
patience: null
warmup_epochs: null
lrf: null
batch_size: null
img_size: null
workers: null
device: null
